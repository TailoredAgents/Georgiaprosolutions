services:
  - type: web
    name: georgia-pro-solutions-production
    runtime: node
    # Paid Starter web service ($7/month); database and cron are separate resources.
    plan: starter
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm run start -- --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: 22.19.0
      - key: NODE_ENV
        value: production
      - key: SITE_MODE
        value: production
      - key: SITE_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: georgia-pro-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ALLOW_INDEXING
        value: "false"
      - key: BUSINESS_DETAILS_APPROVED
        value: "false"
      - key: ANALYTICS_ENABLED
        value: "false"
      - key: NEXT_PUBLIC_ANALYTICS_ENABLED
        value: "false"
  - type: cron
    name: georgia-pro-retention
    runtime: node
    schedule: "17 7 * * *"
    buildCommand: npm ci --omit=dev
    startCommand: npm run db:prune
    envVars:
      - key: NODE_VERSION
        value: 22.19.0
      - key: DATABASE_URL
        fromDatabase:
          name: georgia-pro-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: ANALYTICS_RETENTION_DAYS
        value: "90"
      - key: INQUIRY_RETENTION_DAYS
        value: "365"
databases:
  - name: georgia-pro-db
    plan: basic-256mb
    databaseName: georgiapro
    user: georgiapro
